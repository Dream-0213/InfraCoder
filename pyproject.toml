[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "infracoder"
version = "1.0.0"
description = "Lightweight AI Agent for private-deployed LLMs. Code editing, document processing and AI Infra diagnostics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "XYP" },
]
keywords = ["ai", "agent", "coding", "cli", "llm", "infra", "vllm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["infracoder"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.9.0"]

[project.scripts]
infracoder = "infracoder.cli:main"

[tool.ruff]
line-length = 130
target-version = "py310"
